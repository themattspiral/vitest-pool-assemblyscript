name: Platform Tests (on-demand) - Linux

on:
  workflow_dispatch:

jobs:

  test-linux:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node-version: ['22', '24']
        include:
          # Alpine/musl
          - os: ubuntu-latest
            node-version: '24-alpine'
            container: node:24-alpine
    steps:
      - name: Install test tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++

      - name: Checkout code
        uses: actions/checkout@v6

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js ${{ matrix.node-version }}
        if: matrix.container == ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tc

      - name: Build
        run: npm run build

      - name: Setup External Test Directory
        run: npm run test:ext:setup

      - name: Test Passing Suite Externally
        run: npm run test:ext:pass

      - name: Test Meta Verify Suite Externally
        run: npm run test:ext:meta:verify
      
      - name: v4 - Setup External Test Directory
        run: npm run test:ext:setup:v4

      - name: v4 - Test Passing Suite Externally
        run: npm run test:ext:pass
        
      - name: v4 - Test Meta Verify Suite Externally
        run: npm run test:ext:meta:verify

      - name: v3 - Setup External Test Directory
        run: npm run test:ext:setup:v3

      - name: v3 - Test Passing Suite Externally
        run: npm run test:ext:pass
        
      - name: v3 - Test Meta Verify Suite Externally
        run: npm run test:ext:meta:verify
