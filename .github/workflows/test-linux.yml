name: Platform Tests (on-demand) - Linux

on:
  workflow_dispatch:

jobs:

  test-linux:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node-version: ['22', '24']
        include:
          # Node 20 (linux-x64 only): verify tests run without coverage (multi-memory unavailable)
          - os: ubuntu-latest
            node-version: '20'
          # Alpine/musl: test on Node 22 (minimum supported version with coverage)
          - os: ubuntu-latest
            node-version: '22'
            container: node:22-alpine
    steps:
      - name: Install test tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++

      - name: Checkout code
        uses: actions/checkout@v4

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js ${{ matrix.node-version }}
        if: matrix.container == ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tc

      - name: Build
        run: npm run build

      - name: Run tests
        if: matrix.node-version != '20'
        run: npm run test:external

      - name: Run tests (no coverage)
        if: matrix.node-version == '20'
        run: npm run test:external:no-coverage
