name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run the full pipeline without publishing (semantic-release dry run, skip npm publish)'
        required: false
        type: boolean
        default: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          VITEST_AS_POOL_SKIP_NATIVE_BUILD: 1

      - name: Type check
        run: npm run tc

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist/
            package.json
            README.md
            LICENSE.md
            assembly/
          retention-days: 7

  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-latest
            platform: linux-x64-musl
            container: node:24-alpine
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install build tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++ linux-headers tar

      - name: Checkout code
        uses: actions/checkout@v6

      # Cache prebuilds keyed on files that affect the native addon output.
      # On cache hit, skip the entire build and just upload the cached artifact.
      - name: Cache prebuild
        id: prebuild-cache
        uses: actions/cache@v5
        with:
          path: prebuilds/
          key: prebuild-${{ matrix.platform }}-${{ github.ref_name }}-${{ hashFiles('src/instrumentation/native/**', 'binding.gyp', 'BINARYEN_VERSION', 'scripts/setup-binaryen.js', 'package-lock.json') }}

      # Cache the Binaryen static library build on macOS. The official release only
      # ships .dylib, so we build libbinaryen.a from source with cmake — which takes
      # several minutes. This cache persists across prebuild cache misses (e.g. when
      # only addon code changes) so we only rebuild Binaryen when its version changes.
      - name: Cache Binaryen build (macOS)
        id: binaryen-cache
        if: steps.prebuild-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: third_party/binaryen/
          key: binaryen-${{ matrix.platform }}-${{ hashFiles('BINARYEN_VERSION') }}

      # Install Ninja for faster Binaryen cmake builds on macOS.
      # The setup script auto-detects Ninja and uses it if available.
      - name: Install Ninja (macOS)
        if: steps.prebuild-cache.outputs.cache-hit != 'true' && runner.os == 'macOS' && steps.binaryen-cache.outputs.cache-hit != 'true'
        run: brew install ninja

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js
        if: steps.prebuild-cache.outputs.cache-hit != 'true' && matrix.container == ''
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          VITEST_AS_POOL_SKIP_NATIVE_BUILD: 1

      - name: Download Binaryen dependencies
        if: steps.prebuild-cache.outputs.cache-hit != 'true' && steps.binaryen-cache.outputs.cache-hit != 'true'
        run: npm run setup-binaryen

      - name: Create prebuild
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npm run build:prebuild

      - name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/
          retention-days: 7

  test:
    needs: [build, prebuild]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
        node-version: ['22', '24']
        include:
          - os: ubuntu-latest
            prebuild-artifact: prebuild-linux-x64
          - os: ubuntu-24.04-arm
            prebuild-artifact: prebuild-linux-arm64
          - os: macos-15-intel
            prebuild-artifact: prebuild-darwin-x64
          - os: macos-latest
            prebuild-artifact: prebuild-darwin-arm64
          - os: windows-latest
            prebuild-artifact: prebuild-win32-x64
          - os: windows-11-arm
            prebuild-artifact: prebuild-win32-arm64
          # Uses '24-alpine' to avoid colliding with the ubuntu-latest + '24'
          # (also setup-node is skipped for container jobs).
          - os: ubuntu-latest
            node-version: '24-alpine'
            prebuild-artifact: prebuild-linux-x64-musl
            container: node:24-alpine
    steps:
      - name: Install test tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++

      - name: Checkout code
        uses: actions/checkout@v6

      # Download prebuild BEFORE npm ci so the install script finds it
      # and skips Binaryen download + source compilation
      - name: Download prebuild for this platform
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.prebuild-artifact }}
          path: prebuilds/

      # Workaround for actions/download-artifact#454: the action can silently
      # exit 0 with an incomplete or empty download. Verify the prebuild files
      # actually exist so we don't cascade into an unnecessary source build.
      - name: Verify prebuild downloaded
        run: node scripts/verify-prebuild.js

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js ${{ matrix.node-version }}
        if: matrix.container == ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Setup External Test Directory
        run: npm run test:ext:setup
        
      - name: Test Passing Suite Externally
        run: npm run test:ext:pass
        
      - name: Test Meta Verify Suite Externally
        run: npm run test:ext:meta:verify

      - name: Test Meta Verify Suite Externally (istanbul)
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.node-version == '24'
        run: npm run test:ext:meta:verify:istanbul

      - name: v4 - Setup External Test Directory
        run: npm run test:ext:setup:v4

      - name: v4 - Test Passing Suite Externally
        run: npm run test:ext:pass
        
      - name: v4 - Test Meta Verify Suite Externally
        run: npm run test:ext:meta:verify

      - name: v4 - Test Meta Verify Suite Externally (istanbul)
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.node-version == '24'
        run: npm run test:ext:meta:verify:istanbul

      - name: v3 - Setup External Test Directory
        run: npm run test:ext:setup:v3

      - name: v3 - Test Passing Suite Externally
        run: npm run test:ext:pass
        
      - name: v3 - Test Meta Verify Suite Externally
        run: npm run test:ext:meta:verify

      - name: v3 - Test Meta Verify Suite Externally (istanbul)
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.node-version == '24'
        run: npm run test:ext:meta:verify:istanbul

  release:
    needs: [build, prebuild, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Download all prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: prebuilds/
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          VITEST_AS_POOL_SKIP_NATIVE_BUILD: 1

      - name: Run semantic-release
        run: npx semantic-release ${{ inputs.dry-run == true && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release creates a .tgz tarball only when a new release is published
      # (via @semantic-release/npm with npmPublish: false, tarballDir: '.')
      # Skipped entirely on dry run.
      - name: Publish to npm
        if: ${{ inputs.dry-run != true }}
        run: |
          if ls *.tgz 1>/dev/null 2>&1; then
            npm publish *.tgz --provenance --access public
          fi
