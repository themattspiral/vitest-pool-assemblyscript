name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run the full pipeline without publishing (semantic-release dry run, skip npm publish)'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tc

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            package.json
            README.md
            LICENSE.md
            assembly/
          retention-days: 7

  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-latest
            platform: linux-x64-musl
            container: node:20-alpine
          - os: macos-15
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          # temporarily disabled while figuring out compilation issues
          # - os: windows-latest
          #   platform: win32-x64
          # - os: windows-11-arm
          #   platform: win32-arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install build tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++ linux-headers

      - name: Checkout code
        uses: actions/checkout@v4

      # Install Ninja for faster Binaryen cmake builds on macOS.
      # The setup script auto-detects Ninja and uses it if available.
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js
        if: matrix.container == ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create prebuild
        run: npm run build:prebuild

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/
          retention-days: 7

  test:
    needs: [build, prebuild]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-latest]
        node-version: ['20', '22', '24']
        include:
          - os: ubuntu-latest
            prebuild-artifact: prebuild-linux-x64
          - os: macos-15
            prebuild-artifact: prebuild-darwin-x64
          - os: macos-latest
            prebuild-artifact: prebuild-darwin-arm64
          # Alpine/musl: test on Node 20 (minimum supported version)
          - os: ubuntu-latest
            node-version: '20'
            prebuild-artifact: prebuild-linux-x64-musl
            container: node:20-alpine
          # temporarily disabled while figuring out prebuild compilation issues
          # - os: windows-latest
          #   prebuild-artifact: prebuild-win32-x64
    steps:
      - name: Install test tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++

      - name: Checkout code
        uses: actions/checkout@v4

      # Download prebuild BEFORE npm ci so the install script finds it
      # and skips Binaryen download + source compilation
      - name: Download prebuild for this platform
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.prebuild-artifact }}
          path: prebuilds/

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js ${{ matrix.node-version }}
        if: matrix.container == ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Run tests
        run: npm test

  release:
    needs: [build, prebuild, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds/
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        run: npx semantic-release ${{ inputs.dry-run == true && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release creates a .tgz tarball only when a new release is published
      # (via @semantic-release/npm with npmPublish: false, tarballDir: '.')
      # Skipped entirely on dry run.
      - name: Publish to npm
        if: ${{ inputs.dry-run != true }}
        run: |
          if ls *.tgz 1>/dev/null 2>&1; then
            npm publish *.tgz --provenance --access public
          fi
