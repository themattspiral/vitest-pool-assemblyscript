name: On-Demand Test Runs

on:
  workflow_dispatch:

jobs:
    # needs: [build, prebuild]

  test-linux:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node-version: ['20', '22', '24']
        # include:
        #   - os: ubuntu-latest
        #     prebuild-artifact: prebuild-linux-x64
        #   - os: ubuntu-24.04-arm
        #     prebuild-artifact: prebuild-linux-arm64
        #     # Alpine/musl: test on Node 20 (minimum supported version)
        #   - os: ubuntu-latest
        #     node-version: '20'
        #     prebuild-artifact: prebuild-linux-x64-musl
        #     container: node:20-alpine
    steps:
      - name: Install test tools (Alpine)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++

      - name: Checkout code
        uses: actions/checkout@v4

      # Skip setup-node for container jobs (Node.js is provided by the container image)
      - name: Set up Node.js ${{ matrix.node-version }}
        if: matrix.container == ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tc

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  test-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        node-version: ['20', '22', '24']
        # include:
        #   - os: windows-latest
        #     prebuild-artifact: prebuild-win32-x64
        #   - os: windows-11-arm
        #     prebuild-artifact: prebuild-win32-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tc

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
